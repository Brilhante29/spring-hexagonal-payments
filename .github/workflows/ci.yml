name: ci

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Test and enforce core coverage
        run: ./gradlew test writeCoverage --no-daemon
      - name: Build one-container demo
        run: docker build -t spring-hexagonal-payments .
      - name: Smoke benchmark
        run: >-
          docker run --rm
          -e DURATION=1s
          -e VUS=8
          -e WARMUP_REQUESTS=20
          -e RESULT_PATH=/tmp/payments-smoke.json
          spring-hexagonal-payments
      - name: Validate portfolio contract
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
